apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: vendure-php-admin-ing
  namespace: vendure-ns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/whitelist-source-range: "223.237.179.113/32"

spec:
  ingressClassName: nginx
  tls:
    - hosts: [phpadm.prasanth.space] 
      secretName: vendure-php-admin-tls

  rules:
    - host: phpadm.prasanth.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendure-php-svc
                port:
                  number: 80