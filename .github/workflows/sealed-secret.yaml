name: Seal Secret
on: 
  workflow_dispatch:
    inputs:
      image_branch:
        descriptions:  "Input Your Branch"
        required: false
        type: string

      image_commit_sha:
        descriptions: "Input Your Commit SHA ID"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: vendure-app

    steps:
      # Step 1
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 
      - name: Install KubeSeal
        run: |
          curl -fsSL -o kubeseal.tar.gz https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.37.0/kubeseal-0.37.0-linux-amd64.tar.gz
          tar xzf kubeseal.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal

      # Step 3 
      - name: Files Configurations
        run: |
          pwd
          sed -i "s|@vendure-mysql-root-user@|${{ secrets.VENDURE_MYSQL_ROOT_USER }}|" mysql-operator/sql-secret
          sed -i "s|@vendure-mysql-root-password@|${{ secrets.VENDURE_MYSQL_ROOT_PASSWORD }}|" mysql-operator/sql-secret


          sed -i "s|@vendure-mysql-root-user@|${{ secrets.VENDURE_MYSQL_ROOT_USER }}|" mysql-standalone/sql-secret
          sed -i "s|@vendure-mysql-host@|${{ secrets.VENDURE_MYSQL_HOST }}|" mysql-standalone/sql-secret
          sed -i "s|@vendure-mysql-root-password@|${{ secrets.VENDURE_MYSQL_ROOT_PASSWORD }}|" mysql-standalone/sql-secret


          sed -i "s|@api_env@|${{ secrets.API_ENV }}|" vendure-api/sql-secret
          sed -i "s|@api_port@|${{ secrets.API_PORT }}|" vendure-api/sql-secret
          sed -i "s|@api_secret@|${{ secrets.API_SECRET }}|" vendure-api/sql-secret
          sed -i "s|@api_dash_user@|${{ secrets.API_DASH_USER }}|" vendure-api/sql-secret
          sed -i "s|@api_dash_password@|${{ secrets.API_DASH_PASSWORD }}|" vendure-api/sql-secret
          sed -i "s|@vendure-cors-origin@|${{ secrets.VENDURE_CORS_ORIGIN }}|" vendure-api/sql-secret
          sed -i "s|@vendure-sf-url@|${{ secrets.VENDURE_SF_URL }}|" vendure-api/sql-secret
          
          sed -i "s|@vendure_host@|${{ secrets.VENDURE_HOST }}|" vendure-api/sql-secret
          sed -i "s|@vendure_port@|${{ secrets.VENDURE_PORT }}|" vendure-api/sql-secret
          sed -i "s|@vendure_dbname@|${{ secrets.VENDURE_DBANAME }}|" vendure-api/sql-secret
          sed -i "s|@vendure_user@|${{ secrets.VENDURE_USER }}|" vendure-api/sql-secret
          sed -i "s|@vendure_password@|${{ secrets.VENDURE_PASSWORD }}|" vendure-api/sql-secret

          sed -i "s|@mail_status@|${{ secrets.MAIL_STATUS }}|" vendure-api/sql-secret
          sed -i "s|@smtp_host@|${{ secrets.SMTP_HOST }}|" vendure-api/sql-secret
          sed -i "s|@smtp_port@|${{ secrets.SMTP_PORT }}|" vendure-api/sql-secret
          sed -i "s|@smtp_sec_status@|${{ secrets.SMTP_SEC_STATUS }}|" vendure-api/sql-secret
          sed -i "s|@smtp_mail@|${{ secrets.SMTP_MAIL }}|" vendure-api/sql-secret
          sed -i "s|@smtp_password@|${{ secrets.SMTP_PASSWORD }}|" vendure-api/sql-secret

      # Step 4
      - name: Seal All Three
        run: |
          kubectl create secret generic vendure-sql-secret -n vendure-ns \
            --from-env-file=mysql-operator/sql-secret --dry-run=client -o yaml \
          | kubeseal --cert sealed-secrets-cert.pem -o yaml > mysql-operator/sealed-sql-secret.yaml

          kubectl create secret generic vendure-sql-secret -n vendure-ns \
            --from-env-file=mysql-standalone/sql-secret --dry-run=client -o yaml \
          | kubeseal --cert sealed-secrets-cert.pem -o yaml > mysql-standalone/sealed-sql-secret.yaml

          kubectl create secret generic vendure-secrets -n vendure-ns \
            --from-env-file=vendure-api/sql-secret --dry-run=client -o yaml \
          | kubeseal --cert sealed-secrets-cert.pem -o yaml > vendure-api/sealed-api-secret.yaml
 
      # Step 5
      - name: Commit sealed files
        run: |
          git config user.name "${{ secrets.GIT_USER }}"
          git config user.email "${{ secrets.GIT_MAIL }}"
          git add mysql-operator/sealed-sql-secret.yaml mysql-standalone/sealed-sql-secret.yaml vendure-api/sealed-api-secret.yaml
          git commit -m "Update sealed secrets from ${{ github.run_number}}" || echo "No changes"
          git push

      

  
  
