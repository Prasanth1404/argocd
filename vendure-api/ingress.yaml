apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: vendure-api-ing
  namespace: vendure-ns
  annotations:
    cert-manager.io/cluster.issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

spec:
  ingressClassName: nginx
  tls: 
    - hosts: [api.prasanth.space]
      secretName: vendure-api-tls

  rules:
    - host: api.prasanth.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vendure-api-svc
                port:
                  number: 80


