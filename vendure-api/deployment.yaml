apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendure-api-deploy
  namespace: vendure-ns

spec:
  replicas: 2
  selector:
    matchLabels:
      app: vendure-api

  template:
    metadata:
      labels:
        app: vendure-api

    spec:
      containers:
        - name: vendure-api-cont
          image: 948609688539.dkr.ecr.ap-south-1.amazonaws.com/vendure-api:latest
          command: ["node", "dist/index.js"]
          ports:
            - containerPort: 3000

          envFrom:
            - secretsRef:
                name: sealed-api-secret

          readinessProbe: 
            httpGet: { path: /health, port: 3000}
            initialDelaySeconds: 20
