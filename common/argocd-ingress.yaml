# Password finder - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ing
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.prasanth.space]
      secretName: argocd-ingress-tls
  rules:
    - host: argocd.prasanth.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
