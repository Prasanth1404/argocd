apiVersion: apps/v1
kind: Deployment

metadata:
  name: vendure-sf-dep
  namespace: vendure-ns

spec:
  replicas: 2
  selector:
    matchLabels:
      app: vendure-sf

  template:
    metadata:
      labels:
        app: vendure-sf

    spec:
      containers:
        - name: vendure-sf-cont
          image: 948609688539.dkr.ecr.ap-south-1.amazonaws.com/vendure-sf:latest 
          ports:
            - containerPort: 4201
